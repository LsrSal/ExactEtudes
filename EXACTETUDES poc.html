<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExactEtudes web app for MOTU MTP (Original)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 {
            color: #ffb74d;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .matrix-container {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #2a2a2a;
            color: #ffb74d;
        }
        td input[type="checkbox"] {
            transform: scale(1.3);
            cursor: pointer;
        }
        .info-box {
            background: #2d2416;
            border-left: 4px solid #ffb74d;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .controls-panel {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 12px 15px;
            border-radius: 6px;
        }
        select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 4px;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #ffb74d;
            color: #121212;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ffa726;
        }
        button.secondary {
            background-color: #424242;
            color: #e0e0e0;
        }
        button.secondary:hover {
            background-color: #616161;
        }
        #midi-status {
            font-weight: bold;
            color: #e57373;
        }
        #midi-status.connected {
            color: #81c784;
        }
        /* Terminal Status Line / Box */
        .terminal-box {
            margin-top: 20px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            color: #4caf50;
            max-height: 150px;
            overflow-y: auto;
        }
        .terminal-header {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="matrix-container">
    <h2>EXACTETUDES - MOTU MTP Routing Matrix editor. Proof of concept.</h2>


    <table id="routingTable">
        <thead>
            <tr>
                <th>Input \ Output</th>
                <th>Out 1</th>
                <th>Out 2</th>
                <th>Out 3</th>
                <th>Out 4</th>
                <th>Out 5</th>
                <th>Out 6</th>
                <th>Out 7</th>
                <th>Out 8</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dynamic Grid -->
        </tbody>
    </table>

    <div class="controls-panel">
        <div>
            <label for="midiOutputSelect"><strong>MIDI Out Port:</strong></label>
            <select id="midiOutputSelect" onchange="saveMidiSelection()">
                <option value="">-- Select MIDI Output --</option>
            </select>
            <div style="margin-top: 5px; font-size: 12px;">Web MIDI: <span id="midi-status">Disconnected</span></div>
        </div>
        <div class="button-group">
            <button class="secondary" onclick="clearAllRoutes()">Clear Matrix</button>
            <button onclick="sendRoutingSysEx()">Send SysEx to MTP</button>
        </div>
    </div>

    <!-- Terminal Output Panel -->
    <div class="terminal-box">
        <div class="terminal-header">&gt;&gt; Terminal / SysEx Log Monitor</div>
        <div id="terminalLog">System ready. Previous routing state and MIDI port restored from storage.</div>
    </div>
</div>

<script>
    const numPorts = 8;
    const tbody = document.querySelector("#routingTable tbody");
    const STORAGE_KEY_MATRIX = "motu_mtp_routing_matrix";
    const STORAGE_KEY_PORT = "motu_mtp_selected_midi_port";
    let midiAccessGlobal = null;

    function logToTerminal(message, isError = false) {
        const terminal = document.getElementById("terminalLog");
        let timestamp = new Date().toLocaleTimeString();
        let colorStyle = isError ? "color: #e57373;" : "color: #4caf50;";
        terminal.innerHTML += `<div style="${colorStyle}">[${timestamp}] ${message}</div>`;
        terminal.scrollTop = terminal.scrollHeight;
    }

    // Save current matrix state to localStorage
    function saveMatrixState() {
        let state = {};
        document.querySelectorAll("input[type=checkbox]").forEach(cb => {
            let key = `${cb.dataset.input}_${cb.dataset.output}`;
            state[key] = cb.checked;
        });
        localStorage.setItem(STORAGE_KEY_MATRIX, JSON.stringify(state));
    }

    // Restore matrix state from localStorage
    function loadMatrixState() {
        let saved = localStorage.getItem(STORAGE_KEY_MATRIX);
        if (!saved) return;
        try {
            let state = JSON.parse(saved);
            document.querySelectorAll("input[type=checkbox]").forEach(cb => {
                let key = `${cb.dataset.input}_${cb.dataset.output}`;
                if (state.hasOwnProperty(key)) {
                    cb.checked = state[key];
                }
            });
        } catch (e) {
            console.error("Failed to parse saved routing state:", e);
        }
    }

    // Save selected MIDI output device ID
    function saveMidiSelection() {
        const select = document.getElementById("midiOutputSelect");
        localStorage.setItem(STORAGE_KEY_PORT, select.value);
    }

    // 1. Build 8x8 matrix grid (Direct 1:1 visual indexing)
    for (let inPort = 0; inPort < numPorts; inPort++) {
        let row = document.createElement("tr");
        
        let th = document.createElement("th");
        th.innerText = `In ${inPort + 1}`;
        row.appendChild(th);

        for (let outPort = 0; outPort < numPorts; outPort++) {
            let td = document.createElement("td");
            let checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.dataset.input = inPort;
            checkbox.dataset.output = outPort; 
            checkbox.title = `In ${inPort + 1} -> Out ${outPort + 1}`;

            // Listen for changes to save matrix instantly
            checkbox.addEventListener("change", () => {
                saveMatrixState();
            });

            td.appendChild(checkbox);
            row.appendChild(td);
        }
        tbody.appendChild(row);
    }

    // Load saved matrix states into the freshly built grid
    loadMatrixState();

    // 2. Web MIDI Initialization
    if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess({ sysex: true }).then(onMIDISuccess, onMIDIFailure);
    } else {
        document.getElementById("midi-status").innerText = "Web MIDI not supported in this browser.";
        logToTerminal("Web MIDI API not supported in this browser environment.", true);
    }

    function onMIDISuccess(midiAccess) {
        midiAccessGlobal = midiAccess;
        updateOutputPorts();
        let statusEl = document.getElementById("midi-status");
        statusEl.innerText = "Ready (SysEx Enabled)";
        statusEl.classList.add("connected");
        logToTerminal("Web MIDI access granted with SysEx support.");
        
        midiAccess.onstatechange = updateOutputPorts;
    }

    function onMIDIFailure(err) {
        document.getElementById("midi-status").innerText = "Failed to access MIDI (Check permissions)";
        logToTerminal("Failed to acquire MIDI access. Ensure SysEx permissions are allowed.", true);
        console.error("MIDI Access Error:", err);
    }

    function updateOutputPorts() {
        const select = document.getElementById("midiOutputSelect");
        const savedPortId = localStorage.getItem(STORAGE_KEY_PORT);
        
        select.innerHTML = '<option value="">-- Select MIDI Output --</option>';
        
        let outputs = midiAccessGlobal.outputs.values();
        let foundSavedPort = false;

        for (let output of outputs) {
            let option = document.createElement("option");
            option.value = output.id;
            option.text = output.name;
            
            // Re-select if it matches the saved preference
            if (output.id === savedPortId) {
                option.selected = true;
                foundSavedPort = true;
            }
            select.appendChild(option);
        }

        if (foundSavedPort) {
            logToTerminal("Preferred MIDI output port successfully restored from storage.");
        }
    }

    // 3. Construct and Transmit Hardware-Accurate SysEx without Popups
    function sendRoutingSysEx() {
        const select = document.getElementById("midiOutputSelect");
        const selectedOutputId = select.value;

        if (!selectedOutputId) {
            logToTerminal("Error: No target MIDI output port selected.", true);
            return;
        }

        let outputPort = midiAccessGlobal.outputs.get(selectedOutputId);
        if (!outputPort) {
            logToTerminal("Error: Selected MIDI output port is currently unavailable.", true);
            return;
        }

        logToTerminal(`Transmitting matrix payload to device: "${outputPort.name}"...`);
        
        // Iterate through each Input cable (0 to 7)
        for (let inPort = 0; inPort < numPorts; inPort++) {
            let outByte1_7 = 0x00; // Bitmask for Out 1-7 (max 0x7F)
            let outByte8 = 0x00;   // Flag for Out 8 (0x40 when active)

            for (let outPort = 0; outPort < numPorts; outPort++) {
                let checkbox = document.querySelector(`input[data-input='${inPort}'][data-output='${outPort}']`);
                if (checkbox && checkbox.checked) {
                    if (outPort < 7) {
                        outByte1_7 |= (1 << (6 - outPort));
                    } else if (outPort === 7) {
                        outByte8 = 0x40;
                    }
                }
            }

            // MOTU MTP Original SysEx Payload:
            // F0 00 00 33 02 0A XX YY ZZ 10 F7
            let sysexArray = [
                0xF0, 
                0x00, 0x00, 0x33, // MOTU Enterprise ID
                0x02,             // MTP Original Family ID
                0x0A,             // Command: MIDI Routing Matrix
                inPort,           // XX: Input Cable (0x00 to 0x07)
                outByte1_7,       // YY: Outputs 1–7 Bitmask (0x00 to 0x7F)
                outByte8,         // ZZ: Output 8 Flag (0x00 or 0x40)
                0x10,             // Fixed tail byte
                0xF7              // End of SysEx
            ];

            let hexString = sysexArray.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
            logToTerminal(`In ${inPort + 1} SysEx: ${hexString}`);
            
            outputPort.send(sysexArray);
        }

        logToTerminal("Transmission complete. Routing configuration updated.");
    }

    function clearAllRoutes() {
        document.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false);
        saveMatrixState();
        logToTerminal("Matrix cleared locally and storage updated.");
    }
</script>

</body>
</html>
